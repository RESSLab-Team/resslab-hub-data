name: ci

on:
  push:
    branches:
      - develop
      - main
      - feature/build
  pull_request:
    branches:
      - develop
      - main

jobs:
  upload-data:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker run --rm -e ENV_FOR_DYNACONF=production -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD -v $(pwd):/opt/data ghcr.io/resslab-team/resslab-hub/uploader:latest all /opt/data
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
