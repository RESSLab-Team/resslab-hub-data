name: ci

on:
  push:
    branches:
      - develop
      - main
      - feature/build
  pull_request:
    branches:
      - develop
      - main

jobs:
  check-data:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          path: resslab-hub-data
      - uses: actions/checkout@v3
        with:
          repository: RESSLab-Team/resslab-hub
          token: ${{ secrets.GH_PAT }}
          path: resslab-hub
          ref: develop
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - uses: actions/cache@v3
        with:
          path: ~/.local
          key: poetry-0 # increment to reset cache
      - uses: snok/install-poetry@v1
      - run: |
          poetry install
          make upload-data-prod
        working-directory: "resslab-hub/backend"
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
