name: build-data-image

# Packs the data files into an image tagged `main`. Every deployment (dev,
# stage, prod) uploads from that one image. The hub re-uploads a whole database
# from it with the resslab-hub-upload-data CronJob (ArgoCD -> create-job).
#
# There used to be a `test` branch feeding the stage deployment. It was never
# updated after January 2022 and is gone now, so `main` is the only source.
# Submissions from every environment open their pull request into `main` too;
# the ones made for testing are closed, not merged.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The TIFs stay pointers, .dockerignore drops them anyway.
          lfs: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/resslab-team/resslab-hub-data:${{ github.ref_name }}
