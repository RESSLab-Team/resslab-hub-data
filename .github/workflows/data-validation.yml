name: data-validation

on:
  pull_request:
    branches:
      - develop
      - main

env:
  SERVER_URL: "https://resslab-hub.epfl.ch"
  API_PASSWORD: ${{ secrets.API_PASSWORD_PROD }}

# ... existing changes detection job remains the same ...
jobs:
  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSVs must use LF line endings
        run: |
          BAD=$(git grep -Il $'\r' -- '*.csv' || true)
          if [ -n "$BAD" ]; then
            echo "These CSV files contain CR (\\r) characters — use LF line endings:"
            echo "$BAD"
            exit 1
          fi
      - name: CSVs must end with a newline
        run: |
          BAD=""
          while IFS= read -r f; do
            if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then
              BAD="$BAD$f"$'\n'
            fi
          done < <(git ls-files '*.csv')
          if [ -n "$BAD" ]; then
            echo "These CSV files are missing a final newline:"
            printf '%s' "$BAD"
            exit 1
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      types: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            braces: 'braces/**'
            columns: 'columns/**'
            connections: 'connections/**'
            eccentric-braced-frames: 'eccentric_braced_frames/**'
            hss-columns: 'hss_columns/**'
            material: 'material/**'
            residual-stresses: 'residual_stresses/**'

  authentification:
    runs-on: ubuntu-latest
    steps:
      - run: |
          AUTH_LOG=$(curl -sSL -f -u user:$API_PASSWORD $SERVER_URL/api/user )
          echo "$AUTH_LOG"

  validate:
    if: ${{  needs.changes.outputs.types != '[]' && needs.changes.outputs.types != ''}}
    strategy:
      matrix:
        type: ${{ fromJSON(needs.changes.outputs.types) }}
    needs:
      - authentification
      - changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Prepare validation ${{ matrix.type }}
        run: |
          DIRECTORY=${{ matrix.type }}
          DIRECTORY=${DIRECTORY//-/_}  # Replace hyphens with underscores in directory names
          TAR_NAME=${DIRECTORY}.tar.gz
          git diff --diff-filter=AM --name-only ${{ github.event.pull_request.base.sha }} HEAD $DIRECTORY/ | xargs tar --exclude-vcs -czf $TAR_NAME

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate data ${{ matrix.type }}
        run: |
          DIRECTORY=${{ matrix.type }}
          DIRECTORY=${DIRECTORY//-/_}
          TAR_NAME=${DIRECTORY}.tar.gz
          UPLOAD_TYPE=all-${{ matrix.type }}  # Replace underscores with hyphens for upload type
          echo "Calling: $SERVER_URL/api/validate/?type=$UPLOAD_TYPE"
          VALIDATION_LOG=$(curl -sSL -F file=@$TAR_NAME -u user:$API_PASSWORD $SERVER_URL/api/validate/?type=$UPLOAD_TYPE )
          echo "Validation Results:"
          # First, parse the JSON response
          echo "$VALIDATION_LOG" | jq -r '
              if .valid then
                "\u001b[32m✓ All validations passed\u001b[0m"
              else
                .error_results[] |
                "\u001b[31m✗ Validations failed for \(.file)\u001b[0m\n" + 
                if .errors then
                  "\u001b[31mErrors:\u001b[0m\n" + 
                  (.errors | map("  • \(.)" ) | join("\n"))
                else "" end +
                if .warnings then
                  "\n\u001b[33mWarnings:\u001b[0m\n" + 
                  (.warnings | map("  • \(.)" ) | join("\n"))
                else "" end
              end'
          # Check validation status
          if [[ $(echo "$VALIDATION_LOG" | jq 'if .valid then .valid else false end') == "false" ]]; then
            exit 1
          fi

  # Single stable check to mark as "required" in branch protection: the matrix
  # `validate (<type>)` check names vary per PR, so gate on this job instead.
  validation-passed:
    if: ${{ always() }}
    needs:
      - line-endings
      - changes
      - authentification
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
